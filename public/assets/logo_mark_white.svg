<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Career Navigator logo mark">
  <!--
    Monochrome white mark intended for teal/dark sidebar backgrounds.
    Derived from the provided screenshot: circular mark + orbit arc + compass needle.
  -->
  <g fill="none" fill-rule="evenodd">
    <!-- Main circle -->
    <circle cx="64" cy="64" r="44" fill="#FFFFFF"/>

    <!-- Orbit arc (thick stroke) -->
    <path
      d="M30 54a40 40 0 0 1 78 6"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Compass needle (diamond/arrow shape) -->
    <path
      d="M78 34L44 76l20-8 20 8z"
      fill="#0F766E"
      opacity="0"
    />
    <!-- The needle should be white; we draw it explicitly in white -->
    <path
      d="M80.5 36.5 45.5 79.5 64 72.2 82.5 79.5z"
      fill="#FFFFFF"
    />

    <!-- Center dot -->
    <circle cx="64" cy="64" r="7.5" fill="#FFFFFF"/>
  </g>
</svg>

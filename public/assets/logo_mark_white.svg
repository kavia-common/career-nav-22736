<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Career Navigator logo mark">
  <!--
    Two-tone / knockout variant for teal sidebar backgrounds.
    - White body + orbit remain visible on teal.
    - Inner details are rendered as teal shapes to simulate negative-space cutouts.
    NOTE: This asset is intended specifically for the sidebar color: #0F766E.
  -->
  <g fill="none" fill-rule="evenodd">
    <!-- White base circle -->
    <circle cx="64" cy="64" r="44" fill="#FFFFFF" />

    <!-- Orbit arc (white stroke) -->
    <path
      d="M30 54a40 40 0 0 1 78 6"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Knockout / cutout details (filled with sidebar teal) -->

    <!-- Center cutout (replaces previous white dot) -->
    <circle cx="64" cy="64" r="7.5" fill="#0F766E" />

    <!-- Compass needle cutout (diamond/arrow) -->
    <path d="M80.5 36.5 45.5 79.5 64 72.2 82.5 79.5z" fill="#0F766E" />

    <!-- Small highlight cutout inside the needle for definition -->
    <path d="M61.2 65.9 72.1 47.9 66.1 66.7z" fill="#0F766E" opacity="0.55" />
  </g>
</svg>
